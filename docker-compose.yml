services:
  tracking-packages:
    build: .
    image: tracking-packages:latest
    container_name: tracking-packages
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=production
      - PORT=4200
      - DATA_DIR=/data/tracking-packages
      # Optional API keys for live tracking — set via Portainer or .env
      - API_TOKEN_17TRACK=${API_TOKEN_17TRACK:-}
      - TRACKINGMORE_API_KEY=${TRACKINGMORE_API_KEY:-}
      - FEDEX_API_KEY=${FEDEX_API_KEY:-}
      - FEDEX_API_SECRET=${FEDEX_API_SECRET:-}
      - UPS_CLIENT_ID=${UPS_CLIENT_ID:-}
      - UPS_CLIENT_SECRET=${UPS_CLIENT_SECRET:-}
      - DHL_API_KEY=${DHL_API_KEY:-}
    volumes:
      - tracking-data:/data/tracking-packages
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tracking-data:
    driver: local
    name: tracking-packages-data
